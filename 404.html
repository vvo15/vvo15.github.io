<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f5f1" />
    <meta name="description" content="The requested page could not be found." />
    <title>Page not found | Vincent Vo</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("portfolio-theme");
        } catch (error) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <nav class="nav container" aria-label="Primary navigation">
        <a class="brand" href="index.html">Vincent Vo</a>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 14.2A8.4 8.4 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path></svg>
        </button>
      </nav>
    </header>
    <main id="main-content" tabindex="-1">
      <section class="section error-state" aria-labelledby="not-found-title">
        <div class="container narrow-container">
          <p class="eyebrow">404</p>
          <h1 id="not-found-title">This page took a wrong turn.</h1>
          <p>The page you requested does not exist or may have moved.</p>
          <a class="button primary-button" href="index.html">Return home</a>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> Vincent Vo</p>
        <nav aria-label="Footer links">
          <ul class="footer-links">
            <li><a href="mailto:vovin@bc.edu">Email</a></li>
            <li><a href="https://www.linkedin.com/in/vincent-vo-021b172a4" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
            <li><a href="https://github.com/vvo15" target="_blank" rel="noopener noreferrer">GitHub</a></li>
          </ul>
        </nav>
      </div>
    </footer>
    <script>
      (function () {
        var button = document.getElementById("theme-toggle");
        var currentTheme = document.documentElement.dataset.theme;
        var applyTheme = function (theme, persist) {
          document.documentElement.dataset.theme = theme;
          button.setAttribute("aria-pressed", String(theme === "dark"));
          button.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#12100f" : "#f7f5f1");
          if (persist) {
            try {
              localStorage.setItem("portfolio-theme", theme);
            } catch (error) {
              return;
            }
          }
        };
        applyTheme(currentTheme, false);
        button.addEventListener("click", function () {
          applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
        });
        document.getElementById("year").textContent = new Date().getFullYear();
      })();
    </script>
  </body>
</html>
